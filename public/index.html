<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BookLight</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <div>
      <h1>BookLight</h1>
      <p>AI study dashboard</p>
    </div>

    <nav>
      <button onclick="showPage('dashboard')">Dashboard</button>
      <button onclick="showPage('settings')" class="secondary">Settings</button>
    </nav>

    <div id="aiStatus" class="status-pill">Checking Gemini...</div>
  </header>

  <main id="dashboardPage" class="screen">
    <section class="chat-card card">
      <div class="card-header">
        <div>
          <h2>Study Chat</h2>
          <p>Ask Gemini for quick study help.</p>
        </div>

        <div class="button-row">
          <button onclick="newChat()">New</button>
          <button onclick="loadSessions()" class="secondary">Refresh</button>
        </div>
      </div>

      <div class="chat-grid">
        <aside class="sessions">
          <h3>Sessions</h3>
          <div id="sessionsList"></div>
        </aside>

        <section class="chat-box">
          <div id="chatMessages" class="chat-messages"></div>

          <div class="chat-input-row">
            <textarea id="chatInput" rows="2" placeholder="Ask a study question..."></textarea>
            <button onclick="sendMessage()">Send</button>
          </div>

          <div class="button-row">
            <button onclick="createTaskFromLastAi()" class="secondary">AI → Task</button>
            <button onclick="createEventFromLastAi()" class="secondary">AI → Event</button>
          </div>
        </section>
      </div>
    </section>

    <aside class="right-column">
      <section class="card compact">
        <div class="card-header">
          <h2>Tasks</h2>
          <button onclick="clearCompletedTasks()" class="danger">Clear</button>
        </div>

        <div class="input-row">
          <input id="taskInput" placeholder="Add task..." />
          <button onclick="addTask()">Add</button>
        </div>

        <div id="taskList" class="list-scroll"></div>
      </section>

      <section class="card compact">
        <div class="card-header">
          <button onclick="previousMonth()" class="secondary">‹</button>
          <h2 id="monthLabel">Calendar</h2>
          <button onclick="nextMonth()" class="secondary">›</button>
        </div>

        <div class="input-row calendar-add">
          <input id="eventTitle" placeholder="Event..." />
          <input id="eventDate" type="date" />
          <button onclick="addEvent()">Add</button>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section class="card compact">
        <div class="card-header">
          <h2>Pomodoro</h2>
          <div id="timerDisplay">25:00</div>
        </div>

        <div class="button-row">
          <button onclick="startTimer()">Start</button>
          <button onclick="pauseTimer()" class="secondary">Pause</button>
          <button onclick="resetTimer()" class="secondary">Reset</button>
        </div>

        <div class="stats-row">
          <span>Day <strong id="dayStats">0</strong></span>
          <span>Week <strong id="weekStats">0</strong></span>
          <span>Month <strong id="monthStats">0</strong></span>
        </div>
      </section>
    </aside>
  </main>

  <main id="settingsPage" class="settings-screen hidden">
    <section class="card settings-card">
      <h2>Settings</h2>
      <p class="muted">These settings are saved in your browser.</p>

      <label>
        Gemini model
        <select id="settingModel">
          <option value="gemini-2.0-flash">gemini-2.0-flash</option>
          <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        </select>
      </label>

      <label>
        Pomodoro minutes
        <input id="settingPomodoro" type="number" min="5" max="90" />
      </label>

      <label>
        Theme
        <select id="settingTheme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>

      <label>
        Density
        <select id="settingDensity">
          <option value="compact">Compact</option>
          <option value="comfortable">Comfortable</option>
        </select>
      </label>

      <label>
        Accent color
        <input id="settingAccent" type="color" />
      </label>

      <div class="button-row">
        <button onclick="saveSettings()">Save Settings</button>
        <button onclick="resetSettings()" class="secondary">Reset</button>
        <button onclick="checkAiStatus()" class="secondary">Test Gemini</button>
      </div>

      <p id="settingsNote" class="muted"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
