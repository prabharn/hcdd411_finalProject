<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BookLight</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Open Source Study Dashboard</p>
      <h1>BookLight</h1>
    </div>

    <div id="aiStatus" class="status-pill">Checking Gemini...</div>
  </header>

  <main class="layout">
    <section class="main-panel card">
      <div class="section-header">
        <div>
          <p class="eyebrow">AI Tutor</p>
          <h2>Study Chat</h2>
        </div>

        <div class="button-row">
          <button onclick="newChat()">New Chat</button>
          <button onclick="loadSessions()" class="secondary">Refresh</button>
        </div>
      </div>

      <div class="chat-layout">
        <aside class="sessions-panel">
          <h3>Saved Sessions</h3>
          <div id="sessionsList"></div>
        </aside>

        <section class="chat-panel">
          <div id="chatMessages" class="chat-messages"></div>

          <textarea
            id="chatInput"
            rows="4"
            placeholder="Ask Gemini for study help..."
          ></textarea>

          <div class="button-row">
            <button onclick="sendMessage()">Send</button>
            <button onclick="createTaskFromLastAi()" class="secondary">AI → Task</button>
            <button onclick="createEventFromLastAi()" class="secondary">AI → Event</button>
          </div>
        </section>
      </div>
    </section>

    <aside class="side-panel">
      <section class="card">
        <div class="section-header">
          <div>
            <p class="eyebrow">Tasks</p>
            <h2>To-Do List</h2>
          </div>
        </div>

        <input id="taskInput" placeholder="Add a task..." />

        <div class="button-row">
          <button onclick="addTask()">Add Task</button>
          <button onclick="clearCompletedTasks()" class="danger">Clear Completed</button>
        </div>

        <div id="taskList"></div>
      </section>

      <section class="card">
        <div class="section-header">
          <div>
            <p class="eyebrow">Calendar</p>
            <h2 id="monthLabel">Month</h2>
          </div>

          <div class="button-row">
            <button onclick="previousMonth()" class="secondary">‹</button>
            <button onclick="nextMonth()" class="secondary">›</button>
          </div>
        </div>

        <input id="eventTitle" placeholder="Event title..." />
        <input id="eventDate" type="date" />
        <input id="eventTime" type="time" />

        <button onclick="addEvent()">Add Event</button>

        <div id="calendarGrid" class="calendar-grid"></div>

        <h3>Events</h3>
        <div id="eventList"></div>
      </section>

      <section class="card">
        <div class="section-header">
          <div>
            <p class="eyebrow">Focus</p>
            <h2>Pomodoro Timer</h2>
          </div>
        </div>

        <div id="timerDisplay">25:00</div>

        <div class="button-row center">
          <button onclick="startTimer()">Start</button>
          <button onclick="pauseTimer()" class="secondary">Pause</button>
          <button onclick="resetTimer()" class="secondary">Reset</button>
        </div>

        <div class="stats-grid">
          <div>
            <span id="dayStats">0</span>
            <p>Today</p>
          </div>
          <div>
            <span id="weekStats">0</span>
            <p>Week</p>
          </div>
          <div>
            <span id="monthStats">0</span>
            <p>Month</p>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
