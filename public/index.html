<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BookLight Dashboard</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div>
      <h1>BookLight</h1>
      <p>Open Source AI Study Buddy</p>
    </div>

    <div class="status-pill">
      Study Dashboard
    </div>
  </header>

  <main class="dashboard">
    <section class="ai-panel card">
      <div class="panel-header">
        <div>
          <h2>AI Study Chat</h2>
          <p>Ask a question and turn useful responses into calendar events.</p>
        </div>
      </div>

      <div id="chatBox" class="chat-box">
        <div class="message ai">
          <strong>AI:</strong> Ask me a study question to begin.
        </div>
      </div>

      <div class="chat-input">
        <input
          type="text"
          id="chatInput"
          placeholder="Ask a study question..."
          onkeydown="handleChatKey(event)"
        />
        <button onclick="sendChat()">Send</button>
      </div>
    </section>

    <aside class="tools-panel">
      <section class="card timer-card">
        <div class="panel-header">
          <div>
            <h3>Pomodoro</h3>
            <p>Focus timer</p>
          </div>
        </div>

        <div id="timer">25:00</div>

        <div class="button-row">
          <button onclick="startTimer()">Start</button>
          <button onclick="resetTimer()" class="secondary">Reset</button>
        </div>

        <div id="dailyStats" class="stats-box"></div>
      </section>

      <section class="card task-card">
        <div class="panel-header">
          <div>
            <h3>To-Do List</h3>
            <p>Click a task to complete it.</p>
          </div>
        </div>

        <div class="task-input">
          <input
            type="text"
            id="taskInput"
            placeholder="Add task..."
            onkeydown="handleTaskKey(event)"
          />
          <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList" class="scroll-list"></ul>

        <button onclick="clearCompleted()" class="danger full-width">
          Clear Completed
        </button>
      </section>

      <section class="card calendar-card">
        <div class="panel-header">
          <div>
            <h3>Calendar</h3>
            <p>AI-created study events</p>
          </div>
        </div>

        <ul id="eventList" class="scroll-list"></ul>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
